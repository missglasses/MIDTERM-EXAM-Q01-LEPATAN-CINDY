
<!DOCTYPE html>
<html>
<head>
    <title> Lepatan | Room Reservation System </title>

    <style>
        body{
            font-family: Arial;
            margin: 20px;
        }
        h1{
            text-align: center;
        }
        section{
            margin-bottom: 25px;
        }
        input, button{
            padding: 6px;
            margin: 4px;
        }
        table{
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 6px;
            text-align: left;
        }
        #message{
            font-weight: bold;
        }
        .delete {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Room Reservation System</h1>

    <section>
        <h2>Add Reservation</h2>

        <form id="addForm">
            <input type="text" id="room" placeholder="Room" required>
            <input type="text" id="reserved_by" placeholder="Reserved By" required>
            <input type="text" id="date" placeholder="Date (YYYY-MM-DD)" required>
            <input type="text" id="start_time" placeholder="Start Time (HH:MM)" required>
            <input type="text" id="end_time" placeholder="End Time (HH:MM)" required>
            <button type="submit">Add</button>
        </form>

   
    </section>

 <section>
      <h2>Find Room by ID</h2>
      <form id="searchForm">
        <input type="number" id="searchId" placeholder="Enter room ID" required />
        <button type="submit">Search</button>
      <button type="button" class="secondary" id="showAll">Show All</button>
           <p id="message"></p>
      </form>
    </section>

    <section>
        <h2>Reservations</h2>

        <table>
            <thead>
                <tr>
                <th>ID</th>
                <th>Room</th>
                 <th>Reserved By</th>
                 <th>Date</th>
                <th>Start Time</th>
                 <th>End Time</th>
                 <th>Action</th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>
        </table>
    </section>

    <script>
        const API = "/api/reservations";

        const tableBody = document.getElementById("tableBody");
        const message = document.getElementById("message");

        // displa messg
        function showMessage(text, isError = false) {
            message.textContent = text;
            message.style.color = isError ? "red" : "green"; //di mugana eyy : upd mugana
        }

        //dsipl reserv
        function displayReservations(reservations) {
            tableBody.innerHTML = "";

            if (reservations.length === 0) {
                tableBody.innerHTML =
                    "<tr><td colspan='7'>No reservations found.</td></tr>";
                return;
            }

            reservations.forEach(function(r) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${r.id}</td>
                    <td></td>
                    <td></td>
                     <td>${r.date}</td>
                     <td>${r.start_time}</td>
                    <td>${r.end_time}</td>
                    <td>
                        <button class="delete" data-id="${r.id}">
                            Delete
                        </button>
                    </td>
                `;

            row.children[1].textContent = r.room;
            row.children[2].textContent = r.reserved_by;

                tableBody.appendChild(row);
            });
        }

        // get all reserv
        async function loadReservations() {
            try {
                const response = await fetch(API);
                const data = await response.json();

                if (!response.ok) {
                     showMessage("Cannot load reservations.", true);
                    return;
                }

                displayReservations(data);
            } catch (error) {
                showMessage("Cannot load reservations.", true);
            }
        }

        // new reservation
        document.getElementById("addForm").addEventListener("submit",
            async function(e) {
                e.preventDefault();

                const reservation = {
                    room: document.getElementById("room").value,
                    reserved_by: document.getElementById("reserved_by").value,
                    date: document.getElementById("date").value,
                    start_time: document.getElementById("start_time").value,
                    end_time: document.getElementById("end_time").value
                };

                try {
                    const response = await fetch(API, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(reservation)
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        showMessage(
                            data.message2 || data.message || "Failed to add reservation. Follow format: Date (YYYY-MM-DD), Time (HH:MM).",
                            true
                        );
                        return;
                    }

                    showMessage(data.message1 || "Reservation added successfully!");
                    this.reset();
                    loadReservations();

                } catch (error) {
                    showMessage("Cannot add reservation.", true);
                }
            }
        );

        //displ all reserv
        document.getElementById("showAll").addEventListener("click",
            function() {
                showMessage("");
                loadReservations();
            }
        );

    //serach by id
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('searchId').value;
      try {
        const res = await fetch(`${API}/${id}`);
        const data = await res.json();
        if (!res.ok) {
          renderProducts([]);
          return showMessage(data.error, true);
        }
        renderProducts([data]);
        showMessage(`Found product #${id}`);
      } catch (err) {
        showMessage('Search failed', true);
      }
    });

        //del reserv
        tableBody.addEventListener("click", async function(e) {
            if (e.target.classList.contains("delete")) {
                const id = e.target.dataset.id;

                if (!confirm("Delete reservation #" + id + "?")) {
                    return;
                }

                try {
                    const response = await fetch(API + "/" + id, {
                        method: "DELETE"
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        showMessage(
                            data.message2 || data.message || "Delete failed.",
                            true
                        );
                        return;
                    }

                    showMessage(data.message1 || "Reservation deleted successfully!");
                    loadReservations();

                } catch (error) {
                    showMessage("Cannot delete reservation.", true);
                }
            }
        });

        loadReservations();
    </script>

</body>
</html>
